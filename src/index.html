<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://generativelanguage.googleapis.com; media-src *; script-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data:; font-src https://fonts.gstatic.com"/>
  <title>Prepwise Assistant v2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Cascadia+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="prism.css"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="resume_ui.css"/>
</head>
<body>
  <div id="custom-cursor"></div>
  <div id="cursor-trail"></div>
  <div class="app-container" id="app">
    <div class="title-bar" id="titleBar">
      <div class="title-bar-left">
        <div class="app-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#g1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="g1" x1="2" y1="2" x2="22" y2="22"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient></defs>
          </svg>
        </div>
        <span class="app-title">Prepwise</span>
        <div class="stealth-badge" id="stealthBadge">● GHOST STEALTH</div>
      </div>
      <div class="title-bar-right">
        <button class="icon-btn nav-btn active" data-tab="chatTab" title="Live Interview Chat">💬</button>
        <button class="icon-btn nav-btn" data-tab="modesTab" title="Interview Coach & Resume">🧠</button>
        <button class="icon-btn nav-btn" data-tab="stealthTab" title="Stealth Guard & Voice">🛡️</button>
        <button class="icon-btn nav-btn" data-tab="settingsTab" title="Settings & Keys">⚙️</button>
        <button class="icon-btn" id="minimizeBtn" title="Hide (Ctrl+Shift+H)">—</button>
      </div>
    </div>
    <div class="app-body">

      <!-- TAB 1: LIVE INTERVIEW CHAT -->
      <div class="tab-pane active" id="chatTab">
        <div class="active-mode-banner">
          <span class="banner-label">Current Mode:</span>
          <span class="banner-val" id="activeModeText">⚡ DSA Live Coding (Concise Mode)</span>
          <span class="difficulty-badge diff-medium" id="activeDiffBadge">Medium</span>
        </div>
        <div class="chat-area" id="chatArea">
          <div class="chat-messages" id="chatMessages">
            <div class="message assistant-msg">
              <div class="msg-avatar">G</div>
              <div class="msg-content">
                <p>Hello! I am running in <strong>Ghost Stealth Mode</strong>. Ready to provide flawless, ultra-concise technical guidance.</p>
              </div>
            </div>
          </div>
        </div>
        <div class="quick-pills">
          <button class="pill-btn" onclick="sendQuickPrompt('Analyze time & space complexity')">⚡ Complexity</button>
          <button class="pill-btn" onclick="sendQuickPrompt('Optimize code without changing logic')">🚀 Optimize</button>
          <button class="pill-btn" onclick="sendQuickPrompt('Give me a hint, do not show solution')">💡 Hint</button>
          <button class="pill-btn" onclick="sendQuickPrompt('Check for edge cases and bugs')">🐛 Edge Cases</button>
        </div>
        <div class="input-area">
          <div class="input-wrapper">
            <textarea id="userInput" placeholder="Ask a question or request a code solution... (Shift+Enter for new line)" rows="2" spellcheck="false"></textarea>
            <div class="input-actions">
              <button class="icon-btn scan-btn" id="scanBtn" title="Scan Screen (Ctrl+Shift+A)">📸</button>
              <button class="icon-btn clear-btn" id="clearBtn" title="Clear chat">🗑</button>
              <button class="send-btn" id="sendBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
